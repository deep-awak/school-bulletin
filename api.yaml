openapi: 3.0.3
info:
  title: School Bulletin API
  description: >
    Graduate/grade management API for HEI (POJA template). Auth is a lightweight
    X-User-Id header resolved against the app_user table (see README) - there is
    no login/password flow in this exercise. Every endpoint below matches a real
    controller method in src/main/java/api/poja/app/endpoint.
  version: "1.0.0"
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    UserIdHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: >
        Id of an existing app_user row. Its role (STUDENT/TEACHER/ADMIN) drives
        every permission check in AccessGuard.
  parameters:
    UserIdHeaderParam:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }

    Promotion:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        startYear: { type: integer }
        endYear: { type: integer }
    CreatePromotionRequest:
      type: object
      required: [name, startYear, endYear]
      properties:
        name: { type: string }
        startYear: { type: integer }
        endYear: { type: integer }

    Group:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        promotionId: { type: integer, format: int64 }
    CreateGroupRequest:
      type: object
      required: [name, promotionId]
      properties:
        name: { type: string }
        promotionId: { type: integer, format: int64 }

    Teacher:
      type: object
      properties:
        id: { type: integer, format: int64 }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
    CreateTeacherRequest:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }

    Course:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        code: { type: string }
    CreateCourseRequest:
      type: object
      required: [name, code]
      properties:
        name: { type: string }
        code: { type: string }
    AssignCourseTeachingRequest:
      type: object
      required: [courseId, teacherId, groupId, academicYear]
      properties:
        courseId: { type: integer, format: int64 }
        teacherId: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }
        academicYear: { type: string, example: "2025-2026" }

    Student:
      type: object
      properties:
        id: { type: integer, format: int64 }
        std: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        promotionId: { type: integer, format: int64 }
        currentGroupId: { type: integer, format: int64 }
    CreateStudentRequest:
      type: object
      required: [std, firstName, lastName, email, promotionId, groupId]
      properties:
        std: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        promotionId: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }
    AssignStudentGroupRequest:
      type: object
      required: [studentId, groupId, startDate]
      properties:
        studentId: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }
        startDate: { type: string, format: date }
    StudentGroupAssignment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        studentId: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }

    Grade:
      type: object
      properties:
        id: { type: integer, format: int64 }
        studentId: { type: integer, format: int64 }
        courseId: { type: integer, format: int64 }
        academicYear: { type: string }
        value: { type: number, format: double, minimum: 0, maximum: 20 }
        authorUserId: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateGradeRequest:
      type: object
      required: [studentId, courseId, academicYear, value]
      properties:
        studentId: { type: integer, format: int64 }
        courseId: { type: integer, format: int64 }
        academicYear: { type: string }
        value: { type: number, format: double, minimum: 0, maximum: 20 }
    UpdateGradeRequest:
      type: object
      required: [value, reason]
      description: A reason is mandatory for every grade modification and is kept forever in GradeHistory.
      properties:
        value: { type: number, format: double, minimum: 0, maximum: 20 }
        reason: { type: string }
    GradeHistory:
      type: object
      properties:
        id: { type: integer, format: int64 }
        gradeId: { type: integer, format: int64 }
        oldValue: { type: number, format: double, nullable: true }
        newValue: { type: number, format: double }
        reason: { type: string }
        authorUserId: { type: integer, format: int64 }
        changedAt: { type: string, format: date-time }

    GraduateRow:
      type: object
      properties:
        rank: { type: integer }
        std: { type: string }
        lastName: { type: string }
        firstName: { type: string }
        average: { type: number, format: double }

    SendTranscriptRequest:
      type: object
      required: [studentId, academicYear]
      properties:
        studentId: { type: integer, format: int64 }
        academicYear: { type: string }

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    ValidationError:
      description: Manual validation failed (see validator/ package - no Bean Validation is used)
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    Unauthorized:
      description: Missing or unknown X-User-Id header
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    Forbidden:
      description: The caller's role does not allow this action (see security/AccessGuard)
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }

security:
  - UserIdHeader: []

paths:
  /api/promotions:
    post:
      tags: [Promotions]
      summary: Create a promotion
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreatePromotionRequest' } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Promotion' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Promotions]
      summary: List all promotions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Promotion' } }

  /api/promotions/{id}:
    get:
      tags: [Promotions]
      summary: Get a promotion by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Promotion' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/groups:
    post:
      tags: [Groups]
      summary: Create a group within a promotion
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateGroupRequest' } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Groups]
      summary: List groups of a promotion
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Group' } }

  /api/groups/{id}:
    get:
      tags: [Groups]
      summary: Get a group by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/teachers:
    post:
      tags: [Teachers]
      summary: Create a teacher
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateTeacherRequest' } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Teacher' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Teachers]
      summary: List all teachers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Teacher' } }

  /api/teachers/{id}:
    get:
      tags: [Teachers]
      summary: Get a teacher by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Teacher' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/courses:
    post:
      tags: [Courses]
      summary: Create a course
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateCourseRequest' } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Course' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Courses]
      summary: List all courses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Course' } }

  /api/courses/{id}:
    get:
      tags: [Courses]
      summary: Get a course by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Course' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/courses/teaching-assignments:
    post:
      tags: [Courses]
      summary: Assign a teacher to teach a course to a group for an academic year
      description: A course can have several teachers and several groups, but not necessarily all of them.
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/AssignCourseTeachingRequest' } }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/students:
    post:
      tags: [Students]
      summary: Create a student and open their first group assignment
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateStudentRequest' } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Student' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Students]
      summary: List students of a promotion
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Student' } }

  /api/students/{id}:
    get:
      tags: [Students]
      summary: Get a student by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Student' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/students/group-assignments:
    post:
      tags: [Students]
      summary: Move a student to a new group
      description: >
        Closes the currently active StudentGroupAssignment (sets its endDate) and opens a
        new one - the student's group membership history is never overwritten.
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/AssignStudentGroupRequest' } }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/students/{id}/group-history:
    get:
      tags: [Students]
      summary: Full group assignment history for a student
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/StudentGroupAssignment' } }

  /api/grades:
    post:
      tags: [Grades]
      summary: Create a grade (initial GradeHistory row is created automatically)
      security: [{ UserIdHeader: [] }]
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateGradeRequest' } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Grade' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Grades]
      summary: List a student's grades (self, or any student for TEACHER/ADMIN)
      security: [{ UserIdHeader: [] }]
      parameters:
        - name: studentId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Grade' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/grades/{id}:
    patch:
      tags: [Grades]
      summary: Modify a grade (mandatory reason, appends a GradeHistory row)
      security: [{ UserIdHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/UpdateGradeRequest' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Grade' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/grades/{id}/history:
    get:
      tags: [Grades]
      summary: Full modification history of a grade
      security: [{ UserIdHeader: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GradeHistory' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/promotions/{promotionId}/graduates:
    get:
      tags: [Graduates]
      summary: Ranked graduate list of a promotion (ADMIN only)
      security: [{ UserIdHeader: [] }]
      parameters:
        - name: promotionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GraduateRow' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/promotions/{promotionId}/graduates/export:
    get:
      tags: [Graduates]
      summary: Excel export of a promotion's ranking (ADMIN only, via the API)
      description: >
        Columns: Rang, STD, Nom, Prénom, Moyenne générale. The Thymeleaf page at
        GET /promotions/{id} links to the unauthenticated GET /promotions/{id}/export
        instead, since it has no way to send X-User-Id (see README).
      security: [{ UserIdHeader: [] }]
      parameters:
        - name: promotionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: XLSX file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/promotions/{promotionId}/graduates/results:
    get:
      tags: [Graduates]
      summary: Side-by-side ranking of several promotions (e.g. 3-year results), ADMIN only
      security: [{ UserIdHeader: [] }]
      parameters:
        - name: promotionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: promotionIds
          in: query
          required: true
          schema: { type: array, items: { type: integer, format: int64 } }
          explode: true
      responses:
        '200':
          description: Map of promotionId -> ranking
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items: { $ref: '#/components/schemas/GraduateRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/transcripts/generate:
    post:
      tags: [Transcripts]
      summary: Generate a student's transcript PDF, upload it to S3, return its URL (synchronous)
      security: [{ UserIdHeader: [] }]
      parameters:
        - name: studentId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: academicYear
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/transcripts/send:
    post:
      tags: [Transcripts]
      summary: Generate the PDF, upload to S3, then send it by email asynchronously via POJA
      description: >
        Endpoint -> TranscriptService -> PDF -> S3 -> TranscriptEmailRequested event ->
        existing POJA EventProducer/EventBridge/worker pipeline -> Mailer. Reuses the
        template's async mailing mechanism instead of a new one.
      security: [{ UserIdHeader: [] }]
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/SendTranscriptRequest' } }
      responses:
        '202': { description: Accepted - the email will be sent asynchronously }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /promotions:
    get:
      tags: [Thymeleaf]
      summary: HTML page listing all promotions (no auth, no JSON)
      responses:
        '200':
          description: HTML page
          content:
            text/html: {}

  /promotions/{id}:
    get:
      tags: [Thymeleaf]
      summary: HTML page listing a promotion's students, with a link to the Excel export
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: HTML page
          content:
            text/html: {}

  /promotions/{id}/export:
    get:
      tags: [Thymeleaf]
      summary: Excel export for the Thymeleaf page (no auth header required)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: XLSX file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
