<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Promotions - HEI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f0fe 0%, #d4e0f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px 56px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 20, 50, 0.15);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-4px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 36px;
            padding-bottom: 20px;
            border-bottom: 3px solid #eef3fb;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a2a4a;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 .badge {
            font-size: 14px;
            font-weight: 500;
            background: #2a4a7a;
            color: #fff;
            padding: 4px 14px;
            border-radius: 30px;
            letter-spacing: .3px;
        }

        .header .subtitle {
            color: #6a7a9a;
            font-size: 15px;
            font-weight: 400;
        }

        .stats {
            display: flex;
            gap: 24px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .stats .stat-item {
            background: #f5f8fe;
            padding: 10px 20px;
            border-radius: 14px;
            font-size: 14px;
            color: #2a4a7a;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats .stat-item span {
            background: #2a4a7a;
            color: #fff;
            border-radius: 30px;
            padding: 0 12px;
            font-weight: 700;
            font-size: 14px;
            line-height: 24px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #eef3fb;
            background: #fafcff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }

        thead {
            background: #1a2a4a;
            color: #ffffff;
        }

        thead th {
            padding: 16px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        thead th:last-child {
            text-align: center;
        }

        tbody tr {
            border-bottom: 1px solid #eef3fb;
            transition: background 0.15s ease;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #f0f6ff;
        }

        tbody td {
            padding: 16px 20px;
            color: #1a2a4a;
            vertical-align: middle;
        }

        tbody td:last-child {
            text-align: center;
        }

        .promo-name {
            font-weight: 600;
            color: #0a1a3a;
        }

        .promo-period {
            color: #5a6a8a;
            font-size: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
            background: #2a4a7a;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(42, 74, 122, 0.25);
        }

        .btn:hover {
            background: #1a3a6a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(42, 74, 122, 0.35);
        }

        .btn-outline {
            background: transparent;
            color: #2a4a7a;
            box-shadow: none;
            border: 2px solid #d4e0f5;
        }

        .btn-outline:hover {
            background: #d4e0f5;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(42, 74, 122, 0.15);
        }

        .btn-sm {
            padding: 7px 16px;
            font-size: 13px;
        }

        .btn-icon {
            font-size: 18px;
            line-height: 1;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #6a7a9a;
        }

        .empty-state .emoji {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        .empty-state h3 {
            font-size: 20px;
            color: #1a2a4a;
            margin-bottom: 8px;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: #8a9aba;
            border-top: 1px solid #eef3fb;
            padding-top: 20px;
        }

        .footer a {
            color: #2a4a7a;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .container {
                padding: 24px 16px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .header h1 {
                font-size: 24px;
            }

            .stats {
                gap: 12px;
            }

            .stats .stat-item {
                font-size: 13px;
                padding: 8px 14px;
            }

            thead th,
            tbody td {
                padding: 12px 14px;
                font-size: 13px;
            }

            .btn {
                padding: 8px 16px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 16px 10px;
            }

            .header h1 {
                font-size: 20px;
                flex-wrap: wrap;
            }

            thead th,
            tbody td {
                padding: 10px 10px;
                font-size: 12px;
            }

            .btn-sm {
                padding: 5px 12px;
                font-size: 12px;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            animation: fadeInUp 0.5s ease forwards;
        }

        tbody tr {
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
        }

        tbody tr:nth-child(1) {
            animation-delay: 0.05s;
        }

        tbody tr:nth-child(2) {
            animation-delay: 0.10s;
        }

        tbody tr:nth-child(3) {
            animation-delay: 0.15s;
        }

        tbody tr:nth-child(4) {
            animation-delay: 0.20s;
        }

        tbody tr:nth-child(5) {
            animation-delay: 0.25s;
        }

        tbody tr:nth-child(6) {
            animation-delay: 0.30s;
        }

        tbody tr:nth-child(7) {
            animation-delay: 0.35s;
        }

        tbody tr:nth-child(8) {
            animation-delay: 0.40s;
        }

        tbody tr:nth-child(9) {
            animation-delay: 0.45s;
        }

        tbody tr:nth-child(10) {
            animation-delay: 0.50s;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>
            🎓 Promotions
            <span class="badge">HEI</span>
        </h1>
        <span class="subtitle">Gestion des diplômés</span>
    </div>

    <div class="stats">
        <div class="stat-item">
            Total promotions
            <span th:text="${promotions != null ? promotions.size() : 0}">0</span>
        </div>
        <div class="stat-item">
            Établissement
            <span>HEI</span>
        </div>
    </div>

    <div class="table-wrapper" th:if="${promotions != null and !promotions.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>Nom</th>
                <th>Période</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="promo : ${promotions}">
                <td class="promo-name" th:text="${promo.name}">Promotion 2026</td>
                <td class="promo-period" th:text="${promo.startYear} + ' — ' + ${promo.endYear}">2023 — 2026</td>
                <td>
                    <a class="btn btn-sm btn-outline"
                       th:href="@{'/promotions/' + ${promo.id}}">
                        <span class="btn-icon">👁</span> Voir les diplômés
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-state" th:if="${promotions == null or promotions.isEmpty()}">
        <h3>Aucune promotion</h3>
        <p>Aucune promotion n'est encore enregistrée dans le système.</p>
    </div>

    <div class="footer">
        &copy; 2025 <a href="#">HEI</a> — Tous droits réservés
    </div>
</div>

</body>
</html>
