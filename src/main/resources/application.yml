spring:
  application:
    name: school-bulletin
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

    locations: classpath:db/migration
  thymeleaf:
    cache: false

aws:
  eventBridge:
    bus: ${AWS_EVENT_BUS:}
  # BucketConf (existing template code, untouched) reads this exact key via
  # @Value("${aws.s3.bucket}") - it does NOT read aws.bucket.name.
  s3:
    bucket: ${AWS_S3_BUCKET:}
